name: DockerHub README

on:
  push:
    branches:
      - master
    paths:
      - README.md
      - .github/scripts/dockerhub-readme.sh
      - .github/workflows/dockerhub-readme.yaml

jobs:
  push-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Docker Hub refuses a description over 25000 bytes
      - name: Build DockerHub README
        run: sh .github/scripts/dockerhub-readme.sh README.md DOCKERHUB.md

      - name: Push README to DockerHub
        uses: christian-korneck/update-container-description-action@v1
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          destination_container_repo: hteppl/remnawave-subpage-proxy
          provider: dockerhub
          short_description: "Live templates, conditions and host shuffling for Remnawave (https://docs.rw) subscriptions."
          readme_file: "DOCKERHUB.md"
