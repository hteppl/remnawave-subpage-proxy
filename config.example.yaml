traffic:
  decimals: 2
  # Remnawave stores a "100 GB" plan as 100 GiB, so base 1024 reproduces the
  # number shown in the panel. Set false for KB/MB/GB in powers of 1000.
  binary_units: true
  unlimited: "∞"
  # Hide the quota from the client's own traffic display (sends total=0)
  force_unlimited: false
  # units: ["Б", "КБ", "МБ", "ГБ", "ТБ", "ПБ", "ЭБ"]

# Layouts use Go reference time: 02.01.2006 15:04 is day.month.year hour:minute.
datetime:
  layout: "02.01.2006"
  time_layout: "15:04"
  timezone: "UTC"
  never: "∞"

progress_bar:
  width: 10
  filled: "▰"
  empty: "▱"

template:
  # keep | blank
  unknown: keep
  scan_all_headers: true
  decode_base64: true

# Custom placeholders. Names must be UPPER_SNAKE_CASE.
vars:
  BRAND: "MyProject"
  SUPPORT: "@my_support_bot"

headers:
  - name: announce
    template: "{BRAND} · {TRAFFIC_USED} of {TRAFFIC_LIMIT} used · {DAYS_LEFT} days left · {SUPPORT}"
    # auto | none | base64 | base64-prefixed
    encode: base64-prefixed
    max_length: 200

  # - name: announce
  #   template: "{BRAND} · traffic limit reached · renew at {SUPPORT}"
  #   encode: base64-prefixed
  #   when:
  #     user_statuses: [LIMITED, EXPIRED]

  # - name: profile-title
