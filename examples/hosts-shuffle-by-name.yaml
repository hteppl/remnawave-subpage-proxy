# Group hosts by the name the client shows (link fragment, vmess ps, Xray
# remarks, sing-box tag, Clash proxy name) instead of the hostname.

hosts:
  shuffle:
    - name: "(?i)premium"
    - name: "(?i)free"
    # Both keys given: both must match.
    - hostname: "\\.example\\.com$"
      name: "^🇩🇪 .*\\d+$"

headers:
  - name: announce
    template: "{TRAFFIC_USED} of {TRAFFIC_LIMIT} used · {DAYS_LEFT} days left"
    encode: base64-prefixed
    max_length: 200
