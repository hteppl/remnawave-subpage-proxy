# Spread users across servers: each entry is a regexp matched against the name
# the client shows (link fragment, vmess ps, Xray remarks, sing-box tag, Clash
# proxy name). Every group is shuffled among its own positions on each
# request; hosts matching no group keep their place.

hosts:
  shuffle:
    - "(?i)premium"
    # A second, independent group.
    - "^🇩🇪 "
    # Everything: - ".*"

headers:
  - name: announce
    template: "{TRAFFIC_USED} of {TRAFFIC_LIMIT} used · {DAYS_LEFT} days left"
    encode: base64-prefixed
    max_length: 200
