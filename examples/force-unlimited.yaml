# Hide the quota from the client's built-in traffic display.
#
# subscription-userinfo goes out with total=0, so the app shows no quota bar.
# Nothing else changes: placeholders and conditions keep reporting the real
# quota, so an announce can still state it if you want it stated.

traffic:
  force_unlimited: true

vars:
  BRAND: "MyProject"

headers:
  - name: announce
    template: "{BRAND} · unlimited traffic · {DAYS_LEFT} days left"
    encode: base64-prefixed
    max_length: 200

  # The real quota is still available if you would rather show it in text.
  - name: X-Plan
    template: "{TRAFFIC_USED} of {TRAFFIC_LIMIT}"
    when:
      has_traffic_limit: true
